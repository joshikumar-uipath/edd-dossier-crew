research_media:
  description: >
    Research adverse media for {applicant} ({entity_type}) and any connected
    parties. Cover the last 36 months. Deduplicate coverage of the same event.
    Keep only findings that would materially affect a KYC decision.
    Context you have been given, use it and do not contradict it:
    prior risk opinion {risk_opinion}; application {application}.
    If you find nothing material, say so explicitly.
  expected_output: >
    A list of distinct adverse media events. For each: what happened, when, the
    source, and one line on why it is or is not material. If there are none,
    a single line saying no material adverse media was found.
  agent: media_researcher

resolve_ownership:
  description: >
    For {applicant}, establish the ownership chain to ultimate beneficial owners
    and check the Nigerian registrations the entity should hold: CAC, SCUML where
    the business is designated, NIPC where there is foreign participation, and TIN.
    Application data: {application}.
    For an individual applicant, state that ownership resolution does not apply and
    check identity registrations instead.
    Name what is missing. Never invent a registration number.
  expected_output: >
    The ownership chain with each beneficial owner and their percentage where known,
    plus a registration checklist marking each as present, missing or not applicable.
  agent: registry_analyst

contextualise_screening:
  description: >
    Review the sanctions and PEP screening position for {applicant}.
    Application data: {application}. Prior risk opinion: {risk_opinion}.
    For each hit, decide whether it is a true match or a name collision, and give
    your reasoning. Consider date of birth, nationality, role and jurisdiction.
  expected_output: >
    Each screening hit with a verdict of true match, probable match or collision,
    and the reasoning. If there are no hits, one line stating that.
  agent: sanctions_contextualiser

write_dossier:
  description: >
    Assemble the findings from the other agents into an enhanced due diligence
    dossier for the onboarding officer deciding on {applicant}.
    Attribute every claim to its source. Separate what is established from what
    could not be resolved. Recommend approve, decline, or request more information,
    and give the reason for the recommendation in one sentence.
    Do not make the decision; the officer makes it.
  expected_output: >
    STRICT JSON, no prose outside it, with keys:
    summary (string, three sentences at most),
    findings (array of objects with claim, source, materiality of high|medium|low),
    residual_risk (low|medium|high),
    recommendation (approve|decline|request_more_information),
    recommendation_reason (string),
    unresolved (array of strings).
  agent: edd_writer
