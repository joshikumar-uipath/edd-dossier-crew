[project]
name = "edd_dossier"
version = "1.0.0"
description = "Enhanced due diligence dossier crew for retail account opening"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai[tools]>=0.100.0"]

[project.scripts]
kickoff = "edd_dossier.main:kickoff"
run_crew = "edd_dossier.main:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edd_dossier"]
